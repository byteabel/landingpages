<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;max-width:100vw}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,#2E3452 0%,#4A4A6E 32%,#8A7A8E 62%,#D9A88A 100%);
  color:#F6F2E8;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:16px 12px 120px;overflow-x:hidden;text-align:center;
}
.river{position:fixed;left:0;right:0;bottom:0;width:100%;height:auto;display:block;pointer-events:none;z-index:0}
.container{
  position:relative;z-index:1;width:min(620px,100%);min-width:0;
  background:rgba(38,42,66,.82);border:1px solid rgba(246,242,232,.22);
  border-radius:20px;padding:clamp(18px,4vw,32px) clamp(14px,4vw,28px);
  box-shadow:0 12px 36px rgba(10,12,26,.45);
  backdrop-filter:blur(6px);
}
.salam{
  color:#E5C76B;
  /* Arabic font — option C: Scheherazade New first */
  font-family:"Scheherazade New","Noto Naskh Arabic","Traditional Arabic",Amiri,serif;
  font-size:clamp(28px,7vw,38px);line-height:1.7;font-weight:700;
  margin-bottom:8px;overflow-wrap:break-word;unicode-bidi:plaintext;
}
.icon-wrap{margin:8px auto;width:56px;height:56px;max-width:100%}
.icon-wrap svg{width:100%;height:100%}
.code-svg{width:min(320px,86vw);margin:6px auto 4px;display:block}
.code-svg svg{width:100%;height:auto;display:block}
h1{font-size:clamp(13px,3.5vw,15px);font-weight:600;color:#D8D2C0;margin:2px 0 12px;overflow-wrap:break-word}
.message{font-size:14px;line-height:1.65;color:#C8CBD8;margin-bottom:16px;overflow-wrap:break-word}
.message b{color:#F6F2E8}
.ayah{background:rgba(246,242,232,.08);border:1px solid rgba(246,242,232,.20);border-radius:14px;padding:12px 14px;margin-bottom:18px}
.ayah-ar{font-family:"Scheherazade New","Noto Naskh Arabic","Traditional Arabic",Amiri,serif;font-size:clamp(16px,4vw,19px);line-height:1.9;color:#F6F2E8;margin-bottom:6px;overflow-wrap:break-word}
.ayah-en{font-size:13px;line-height:1.6;color:#C8CBD8;font-style:italic}
.ayah-ref{margin-top:6px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#9AA0B8}
.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 20px;max-width:100%;border-radius:999px;text-decoration:none;font-weight:600;font-size:14px;border:1px solid #F6F2E8;cursor:pointer;font-family:inherit;transition:.2s;white-space:nowrap}
.btn svg{width:17px;height:17px;flex:0 0 17px}
.btn-primary{background:#F6F2E8;color:#2E3452}
.btn-primary:hover{background:#E8E6DC}
.btn-soft{background:transparent;color:#F6F2E8;border-color:rgba(246,242,232,.45)}
.btn-soft:hover{background:rgba(246,242,232,.12)}
@media(max-width:480px){
  body{padding-bottom:90px}
  .buttons{flex-direction:column}
  .btn{width:100%}
  .river{height:110px}
}
</style>
</head>
